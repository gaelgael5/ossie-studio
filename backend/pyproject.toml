[project]
name = "ossie-studio"
version = "0.1.0"
description = "Ossie Studio — construction d'une couche sémantique (backend applicatif)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    "itsdangerous>=2.2",
    "cryptography>=50.0.2",
    "authlib>=1.9.8",
    "httpx>=0.28.1",
    "joserfc>=1.8.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.26.1",
    "tree-sitter-c-sharp==0.24.0",  # grammaire épinglée (sa version entre dans celle du parseur)
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-kotlin>=1.1.0",
    "sqlglot==30.33.0",
    "defusedxml==0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    # Utilisé seulement par le faux IdP des tests (endpoint /token form-urlencoded).
    "python-multipart>=0.0.9",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ossie_studio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "S101", # assert : légitime dans les tests
]

[tool.ruff.lint.per-file-ignores]
# S105/S106 : mots de passe factices ; S603/S607 : appel à git en sous-process
# pour préparer des dépôts de test.
"tests/*" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ossie_studio"]

[[tool.mypy.overrides]]
module = ["authlib.*", "asyncpg.*"]
ignore_missing_imports = true
