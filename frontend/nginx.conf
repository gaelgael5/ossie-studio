server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'API du backend est relayée côté serveur : le navigateur ne voit qu'une
    # seule origine. /auth porte le flux OIDC (redirections du navigateur).
    location ~ ^/(api|auth)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Surface MCP et sa découverte OAuth (RFC 9728 / 8414) : relayées telles
    # quelles. Pas de mise en tampon : le transport MCP peut répondre en flux.
    location ~ ^/(mcp/?$|\.well-known/oauth-) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
